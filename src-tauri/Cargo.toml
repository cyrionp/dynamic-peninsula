[package]
name = "dynamic-peninsula"
version = "0.1.0"
description = "A small companion that hangs from the top edge of your screen"
authors = ["cyrionp"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cyrionp/dynamic-peninsula"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "dynamic_peninsula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
